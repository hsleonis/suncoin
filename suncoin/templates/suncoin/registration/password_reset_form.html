{% extends "suncoin/index.html" %}
{% load static %}

{% block maincontent %}
<div class="login-box">
  <div class="login-logo">
    <a href="/"><b><img src="{% static 'suncoin/img/suncoin-up.png' %}"></b></a>
  </div>
  <!-- /.login-logo -->
  <div class="login-box-body">
    <p class="login-box-msg">Enter your Email</p>

    <form action="" method="post" class="form-element">
	  {% csrf_token %}

      {{ form.as_p }}

      <div class="row">
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-block btn-flat margin-top-10 btn-primary">REMIND PASSWORD</button>
        </div>
        <!-- /.col -->
      </div>
    </form>

    <div class="margin-top-30 text-center">
    	<p>Don't have an account? <a href="{% url 'signup' %}" class="text-info m-l-5">Sign Up</a></p>
    </div>

  </div>
  <!-- /.login-box-body -->
</div>
<!-- /.login-box -->
{% endblock maincontent %}
